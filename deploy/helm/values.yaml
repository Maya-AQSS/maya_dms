# maya-dms — values de producción sobre el library chart maya-common (0.2.2).
# Solo lo que difiere de los defaults de maya-common (charts/maya-common/values.yaml).
#
# Secretos: Vault, ruta secret/data/maya-dms con las claves de vault.keys
# (REDIS_PASSWORD = SESSION_PASS de secret/data/redis; FDW_*_PASSWORD = contraseña
# del rol lector maya_fdw_reader). image.tag lo fija helmfile (misma versión que el chart).
# Hosts: dms.ceedcv (SPA) y api.dms.ceedcv (API y WebSocket en /app).

image:
  registry: 10.224.237.240:5000
  repository: maya/maya-dms
  tag: ''
  pullSecrets:
  - name: regcred
vault:
  keys:
  - APP_KEY
  - DB_PASSWORD
  - REDIS_PASSWORD
  - RABBITMQ_PASSWORD
  - REVERB_APP_KEY
  - REVERB_APP_SECRET
  - FDW_ODOO_PASSWORD
  - FDW_USER_PERMISSIONS_PASSWORD
  - FDW_NOTIFICATION_RULES_PASSWORD
  - FDW_PERMISSIONS_PASSWORD
config:
  APP_NAME: Maya DMS
  APP_URL: https://api.dms.ceedcv
  BROADCAST_CONNECTION: reverb
  CACHE_STORE: redis
  CORS_ADDITIONAL_ORIGINS: ''
  CORS_REGEX_DOMAIN: ceedcv
  DB_CONNECTION: pgsql
  DB_DATABASE: maya_dms_db
  DB_HOST: 10.224.237.252
  DB_PORT: '5432'
  DB_USERNAME: maya_dms_user
  EDITOR_BACKEND: tiptap
  FDW_NOTIFICATION_RULES_DATABASE: maya_dashboard
  FDW_NOTIFICATION_RULES_HOST: 10.224.237.252
  FDW_NOTIFICATION_RULES_PORT: '5432'
  FDW_NOTIFICATION_RULES_SCHEMA: public
  FDW_NOTIFICATION_RULES_TABLE: v_notification_rules
  FDW_NOTIFICATION_RULES_USERNAME: maya_fdw_reader
  FDW_ODOO_DATABASE: maya_erp
  FDW_ODOO_HOST: 10.224.237.252
  FDW_ODOO_PORT: '5432'
  FDW_ODOO_USERNAME: maya_fdw_reader
  FDW_PERMISSIONS_DATABASE: maya_auth
  FDW_PERMISSIONS_HOST: 10.224.237.252
  FDW_PERMISSIONS_PORT: '5432'
  FDW_PERMISSIONS_SCHEMA: public
  FDW_PERMISSIONS_TABLE: v_dms_permissions
  FDW_PERMISSIONS_USERNAME: maya_fdw_reader
  FDW_USERS_CACHE_TTL: '900'
  FDW_USERS_DATABASE: maya_erp
  FDW_USERS_HOST: 10.224.237.252
  FDW_USERS_PORT: '5432'
  FDW_USERS_SCHEMA: public
  FDW_USERS_TABLE: v_app_users
  FDW_USERS_USERNAME: maya_fdw_reader
  FDW_USER_PERMISSIONS_DATABASE: maya_auth
  FDW_USER_PERMISSIONS_HOST: 10.224.237.252
  FDW_USER_PERMISSIONS_PORT: '5432'
  FDW_USER_PERMISSIONS_REMOTE_VIEW: v_dms_user_permissions
  FDW_USER_PERMISSIONS_SCHEMA: public
  FDW_USER_PERMISSIONS_USERNAME: maya_fdw_reader
  JWKS_CACHE_TTL: '3600'
  JWKS_URL: http://keycloak-maya-app.maya-iam.svc.cluster.local:8080/realms/CEED/protocol/openid-connect/certs
  JWT_AUDIENCE: maya-dms
  JWT_ISSUER: https://keycloak.ceedcv/realms/CEED
  LOG_CHANNEL: stack
  LOG_LEVEL: info
  LOG_RABBIT_LEVEL: warning
  LOG_STACK: stderr,rabbit
  MAIL_MAILER: log
  MAYA_MESSAGING_APP: maya-dms
  QUEUE_CONNECTION: redis
  RABBITMQ_HOST: rabbitmq-maya-app.maya-sync.svc.cluster.local
  RABBITMQ_PORT: '5672'
  RABBITMQ_USER: maya_dms
  RABBITMQ_VHOST: /maya
  REDIS_CACHE_DB: '5'
  REDIS_CLIENT: phpredis
  REDIS_DB: '4'
  REDIS_HOST: redis-session-maya-app.maya-infra.svc.cluster.local
  REDIS_PORT: '6379'
  REVERB_APP_ID: maya-dms
  REVERB_HOST: maya-dms-reverb
  REVERB_PORT: '8080'
  REVERB_SCHEME: http
  REVERB_SERVER_HOST: 0.0.0.0
  REVERB_SERVER_PORT: '8080'
  SESSION_DRIVER: redis
  SESSION_LIFETIME: '120'
  SESSION_SAME_SITE: lax
  TEAM_MANAGEMENT_ROLES: manager,super-admin,admin
frontend:
  env:
    MAYA_PUBLIC_APP_NAME: Maya DMS
    MAYA_PUBLIC_API_URL: https://api.dms.ceedcv/api/v1
    MAYA_PUBLIC_KEYCLOAK_URL: https://keycloak.ceedcv
    MAYA_PUBLIC_KEYCLOAK_REALM: CEED
    MAYA_PUBLIC_KEYCLOAK_CLIENT_ID: maya-dms
    MAYA_PUBLIC_DASHBOARD_URL: https://dashboard.ceedcv
    MAYA_PUBLIC_DASHBOARD_API_URL: https://api.dashboard.ceedcv
    MAYA_PUBLIC_PEER_HOST_PATTERN: subdomain-api
    MAYA_PUBLIC_REVERB_HOST: api.dms.ceedcv
    MAYA_PUBLIC_REVERB_PORT: '443'
    MAYA_PUBLIC_REVERB_SCHEME: https
    MAYA_PUBLIC_REVERB_AUTH_ENDPOINT: https://api.dms.ceedcv/api/v1/broadcasting/auth
    MAYA_PUBLIC_REVERB_APP_KEY: CHANGE-ME
    MAYA_CSP: 'default-src ''self''; script-src ''self''; style-src ''self'' ''unsafe-inline''; img-src ''self'' data: blob:;
      font-src ''self'' data:; connect-src ''self'' https://api.dms.ceedcv https://api.dashboard.ceedcv https://keycloak.ceedcv
      wss://api.dms.ceedcv; frame-src https://keycloak.ceedcv; frame-ancestors ''none''; base-uri ''self''; form-action
      ''self'''
    MAYA_PUBLIC_EDITOR_BACKEND: tiptap
scheduler:
  enabled: true
ingress:
  host: dms.ceedcv
  apiHost: api.dms.ceedcv
networkPolicy:
  egress:
    cidrs:
    - cidr: 10.224.237.252/32
      ports:
      - 5432
    namespaces:
    - name: maya-infra
      ports:
      - 6379
    - name: maya-sync
      ports:
      - 5672
    - name: maya-iam
      ports:
      - 8080
    internet: true
storage:
  enabled: true
  subPath: dms
  size: 20Gi
api:
  resources:
    requests:
      cpu: 200m
      memory: 384Mi
    limits:
      cpu: 1500m
      memory: 768Mi
worker:
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: '1'
      memory: 768Mi
